services:
  - type: web
    name: blood-donor-emergency-connect
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: JWT_SECRET
        generateValue: true
      - key: NODE_VERSION
        value: 20.0.0
      - key: TURSO_DATABASE_URL
        sync: false   # you paste this in manually from your Turso dashboard
      - key: TURSO_AUTH_TOKEN
        sync: false   # you paste this in manually from your Turso dashboard
      - key: ADMIN_EMAIL
        sync: false   # optional: the email(s) you want promoted to admin
      - key: SALESFORCE_LOGIN_URL
        sync: false   # optional: defaults to https://login.salesforce.com if unset
      - key: SALESFORCE_CLIENT_ID
        sync: false   # optional: enables Salesforce sync when set with the 3 below
      - key: SALESFORCE_CLIENT_SECRET
        sync: false
      - key: SALESFORCE_USERNAME
        sync: false
      - key: SALESFORCE_PASSWORD
        sync: false   # your Salesforce password + security token, concatenated
      - key: BREVO_API_KEY
        sync: false   # email OTP delivery (Brevo HTTPS API; free plan)
      - key: EMAIL_FROM
        sync: false   # a sender address you verified in Brevo
      - key: FAST2SMS_API_KEY
        sync: false   # SMS OTP (India) - or use the TWILIO_* variables instead
      - key: OTP_DEV_MODE
        sync: false   # "true" = demo mode (codes shown on screen, nothing sent)
      - key: REQUIRE_VERIFICATION
        sync: false   # set to "false" to switch verification off
      - key: DONATION_COOLDOWN_DAYS
        sync: false   # default 30
      - key: FIREBASE_API_KEY
        sync: false   # email verification (free): from Firebase console -> web app config
      - key: FIREBASE_AUTH_DOMAIN
        sync: false
      - key: FIREBASE_PROJECT_ID
        sync: false
      - key: FIREBASE_APP_ID
        sync: false   # optional
      - key: PHONE_EMAIL_CLIENT_ID
        sync: false   # mobile verification: Client ID from your Phone.Email dashboard
